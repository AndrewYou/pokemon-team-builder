services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokemon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pokemon"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      # `db` is the compose service name; no sslmode, so no TLS is negotiated.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pokemon
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pokemon
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
