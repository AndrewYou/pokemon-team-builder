[project]
name = "pokemon-team-builder-api"
version = "0.1.0"
description = "Pokemon Team Builder API"
# Upper bound pins us to the same minor the Dockerfile builds on. SQLAlchemy's
# async bridge needs greenlet, which lags new interpreter releases by months.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    # Implicit dependency of SQLAlchemy's async bridge; pinned explicitly so a
    # resolver that skips it fails loudly at install rather than at query time.
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    # Sync driver, used only by Alembic. libpq-based, so it reads sslmode natively.
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-tqdm>=4.66.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated DDL. Long column definitions are inherent; rewrapping them
# only creates churn on every new revision.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
